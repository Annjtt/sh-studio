# Deploy static site to GitHub Pages
name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; queued runs wait instead of being cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # There is no build: the site is plain HTML/CSS/JS and is already in the repo.
      # Collect the published files into one folder, so .git, docs/ and .github/
      # stay private and the artifact stays small.
      - name: Collect site files
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp -r .nojekyll index.html portfolio.html admin.html css js asset _site/
          echo "--- _site content ---"
          ls -a _site

      # Fail the deploy instead of publishing a broken site: a missing file in the
      # repository (e.g. js/vendor/three/build/ hidden by a .gitignore rule) is
      # invisible here and only shows up as a 404 on the live site
      - name: Verify required files
        run: |
          set -e
          missing=0
          for f in .nojekyll index.html portfolio.html admin.html \
                   css/style.css css/glass-effects.css \
                   js/main.js js/space-bg.js \
                   js/vendor/three/build/three.module.min.js \
                   js/vendor/three/jsm/lines/LineMaterial.js; do
            if [ -e "$f" ]; then
              echo "ok   $f"
            else
              echo "MISS $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Required files are missing from the repository. Check .gitignore."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
