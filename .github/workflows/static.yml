# Deploy static site to GitHub Pages
name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; queued runs wait instead of being cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # No build step: the site is plain HTML/CSS/JS and is already in the repo.
      # Upload only the published files - .git, docs/ and .github/ stay private
      # and the artifact stays small.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            .nojekyll
            index.html
            portfolio.html
            admin.html
            css
            js
            asset

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
